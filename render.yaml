services:
  - type: web
    name: fastlead-n8n
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: fastlead-n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: fastlead-n8n-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        value: n8n
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: fastlead-n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: fastlead-n8n-db
          property: password
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: WEBHOOK_URL
        value: https://n8n.leadfast.raghavsathishmohan.com
    domains:
      - n8n.leadfast.raghavsathishmohan.com

databases:
  - name: fastlead-n8n-db
    plan: starter
    ipAllowList: []
