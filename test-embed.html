<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadFast Embed Test</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 { color: #333; }
    form {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
      color: #555;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      background: #f59e0b;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #d97706; }
  </style>
</head>
<body>
  <h1>Test Contact Form</h1>
  <p>This simulates a typical contractor website contact form.</p>

  <form action="/thank-you" method="POST">
    <label for="name">Your Name</label>
    <input type="text" id="name" name="name" placeholder="John Doe" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="john@example.com" required>

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone" placeholder="(555) 123-4567">

    <label for="service">Service Needed</label>
    <input type="text" id="service" name="service" placeholder="Roof repair, bathroom remodel, etc.">

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="4" placeholder="Tell us about your project..."></textarea>

    <button type="submit">Get a Free Quote</button>
  </form>

  <!-- LeadFast Embed -->
  <script src="https://leadfast.raghavsathishmohan.com/embed.js" data-token="90bf2822-5ec2-42d6-abc1-8fa0a86e073b"></script>
</body>
</html>
